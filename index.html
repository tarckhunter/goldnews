<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS Gold News Countdown</title>

    <style>
        :root {
            --cyan: #00efff;
            --blue: #0077ff;
            --dark: #02080d;
            --panel: rgba(0, 239, 255, 0.06);
            --danger: #ff3158;
            --success: #00ff9d;
            --progress: 360deg;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            min-height: 100vh;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: var(--cyan);
            font-family: "Courier New", monospace;
            background:
                radial-gradient(
                    circle at center,
                    #073043 0%,
                    #020c13 48%,
                    #000 100%
                );
        }

        /*
         * ล็อกการเลื่อนหน้าเว็บขณะอยู่ใน Full Screen
         */
        html.fullscreen-active,
        body.fullscreen-active {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
        }

        /* เส้นตารางพื้นหลัง */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.15;
            background-image:
                linear-gradient(
                    rgba(0, 239, 255, 0.2) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 239, 255, 0.2) 1px,
                    transparent 1px
                );
            background-size: 40px 40px;
        }

        /* เส้นสแกนหน้าจอ */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: -20%;
            height: 130px;
            pointer-events: none;
            opacity: 0.25;
            background: linear-gradient(
                transparent,
                rgba(0, 239, 255, 0.15),
                transparent
            );
            animation: scan 6s linear infinite;
        }

        @keyframes scan {
            from {
                transform: translateY(-20vh);
            }

            to {
                transform: translateY(130vh);
            }
        }

        .app {
            position: relative;
            width: min(950px, 100%);
            padding: 24px;
            border: 1px solid rgba(0, 239, 255, 0.45);
            border-radius: 20px;
            text-align: center;
            background: rgba(0, 10, 18, 0.82);
            box-shadow:
                0 0 35px rgba(0, 239, 255, 0.18),
                inset 0 0 30px rgba(0, 239, 255, 0.06);
            backdrop-filter: blur(12px);
        }

        .app::before,
        .app::after {
            content: "";
            position: absolute;
            width: 55px;
            height: 55px;
            pointer-events: none;
        }

        .app::before {
            top: 10px;
            left: 10px;
            border-top: 3px solid var(--cyan);
            border-left: 3px solid var(--cyan);
        }

        .app::after {
            right: 10px;
            bottom: 10px;
            border-right: 3px solid var(--cyan);
            border-bottom: 3px solid var(--cyan);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 18px;
            text-align: left;
        }

        .system-name {
            color: white;
            font-size: clamp(18px, 3vw, 27px);
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 12px var(--cyan);
        }

        .subtitle {
            margin-top: 6px;
            color: rgba(0, 239, 255, 0.7);
            font-size: 12px;
            letter-spacing: 2px;
        }

        .current-time-box {
            text-align: right;
        }

        #currentTime {
            color: white;
            font-size: clamp(20px, 4vw, 32px);
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--cyan);
        }

        #currentDate {
            margin-top: 5px;
            color: rgba(0, 239, 255, 0.75);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .status-bar {
            margin: 15px 0 25px;
            padding: 11px;
            border: 1px solid rgba(0, 239, 255, 0.3);
            border-radius: 8px;
            color: var(--success);
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(0, 239, 255, 0.04);
        }

        .countdown-area {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 390px;
        }

        .countdown-ring {
            position: relative;
            width: min(340px, 76vw);
            aspect-ratio: 1;
            padding: 15px;
            border-radius: 50%;
            background: conic-gradient(
                var(--cyan) 0deg,
                var(--cyan) var(--progress),
                rgba(0, 239, 255, 0.1) var(--progress),
                rgba(0, 239, 255, 0.1) 360deg
            );
            box-shadow:
                0 0 35px rgba(0, 239, 255, 0.28),
                inset 0 0 35px rgba(0, 239, 255, 0.16);
            transition:
                background 0.08s linear,
                filter 0.2s;
        }

        .countdown-ring::before {
            content: "";
            position: absolute;
            inset: -13px;
            border: 1px dashed rgba(0, 239, 255, 0.5);
            border-radius: 50%;
            animation: rotate 16s linear infinite;
        }

        .countdown-ring::after {
            content: "";
            position: absolute;
            inset: -28px;
            border-top: 3px solid var(--cyan);
            border-right: 3px solid transparent;
            border-bottom: 3px solid var(--cyan);
            border-left: 3px solid transparent;
            border-radius: 50%;
            opacity: 0.65;
            animation: rotateReverse 8s linear infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            to {
                transform: rotate(-360deg);
            }
        }

        .countdown-inner {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(0, 239, 255, 0.45);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(
                    circle,
                    rgba(0, 239, 255, 0.12),
                    #001018 67%
                );
            box-shadow:
                inset 0 0 45px rgba(0, 239, 255, 0.13);
        }

        .count-label {
            margin-bottom: 2px;
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(0, 239, 255, 0.7);
        }

        #countdown {
            min-width: 3ch;
            color: white;
            font-family: Arial, sans-serif;
            font-size: clamp(110px, 25vw, 185px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -8px;
            text-align: center;
            text-shadow:
                0 0 10px white,
                0 0 25px var(--cyan),
                0 0 55px var(--cyan);
        }

        #milliseconds {
            min-height: 25px;
            margin-top: 5px;
            color: rgba(0, 239, 255, 0.8);
            font-size: 18px;
            letter-spacing: 4px;
        }

        /* สีแดงเมื่อเหลือ 3 วินาที */
        .warning {
            --cyan: #ff3158;
            animation: dangerPulse 0.55s infinite alternate;
        }

        @keyframes dangerPulse {
            from {
                filter: brightness(1);
                transform: scale(1);
            }

            to {
                filter: brightness(1.7);
                transform: scale(1.025);
            }
        }

        /* เอฟเฟกต์เมื่อข่าวออก */
        .released {
            --cyan: #00ff9d;
            animation: releasePulse 0.35s infinite alternate;
        }

        @keyframes releasePulse {
            from {
                filter: brightness(1);
            }

            to {
                filter: brightness(2);
            }
        }

        .controls {
            display: grid;
            grid-template-columns: 1.5fr 0.7fr;
            gap: 12px;
            margin-top: 22px;
            text-align: left;
        }

        .control-group {
            padding: 15px;
            border: 1px solid rgba(0, 239, 255, 0.25);
            border-radius: 10px;
            background: var(--panel);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(0, 239, 255, 0.8);
            font-size: 12px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            min-height: 47px;
            padding: 10px 12px;
            border: 1px solid rgba(0, 239, 255, 0.55);
            border-radius: 7px;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 15px;
            background: #03141d;
        }

        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 239, 255, 0.3);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        button {
            min-height: 50px;
            padding: 10px;
            border: 1px solid var(--cyan);
            border-radius: 7px;
            cursor: pointer;
            color: var(--cyan);
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(0, 239, 255, 0.08);
            transition: 0.2s ease;
        }

        button:hover {
            color: #001015;
            background: var(--cyan);
            box-shadow:
                0 0 20px rgba(0, 239, 255, 0.55);
            transform: translateY(-2px);
        }

        button.cancel {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 49, 88, 0.08);
        }

        button.cancel:hover {
            color: white;
            background: var(--danger);
            box-shadow:
                0 0 20px rgba(255, 49, 88, 0.45);
        }

        .info {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.48);
            font-size: 11px;
            line-height: 1.6;
        }

        /*
         * ปุ่ม EXIT จะถูกซ่อนในหน้าปกติ
         */
        #exitFullScreenButton {
            display: none;
        }

        /*
         * =========================================================
         * รูปแบบสำหรับ Full Screen
         * =========================================================
         */

        .app:fullscreen,
        .app:-webkit-full-screen {
            width: 100vw;
            max-width: none;
            height: 100vh;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    #073043 0%,
                    #020c13 48%,
                    #000 100%
                );
            box-shadow: none;
        }

        /*
         * ซ่อนข้อมูลที่ไม่ต้องการใน Full Screen
         */
        .app:fullscreen .header > div:first-child,
        .app:fullscreen #currentDate,
        .app:fullscreen .status-bar,
        .app:fullscreen .controls,
        .app:fullscreen .buttons,
        .app:fullscreen .info,
        .app:-webkit-full-screen .header > div:first-child,
        .app:-webkit-full-screen #currentDate,
        .app:-webkit-full-screen .status-bar,
        .app:-webkit-full-screen .controls,
        .app:-webkit-full-screen .buttons,
        .app:-webkit-full-screen .info {
            display: none !important;
        }

        /*
         * ตำแหน่ง HH:mm:ss ใน Full Screen
         */
        .app:fullscreen .header,
        .app:-webkit-full-screen .header {
            position: absolute;
            z-index: 20;
            top: clamp(16px, 3vh, 35px);
            left: 0;
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none;
        }

        .app:fullscreen .current-time-box,
        .app:-webkit-full-screen .current-time-box {
            width: 100%;
            text-align: center;
        }

        .app:fullscreen #currentTime,
        .app:-webkit-full-screen #currentTime {
            font-size: clamp(30px, 5vw, 68px);
            font-weight: bold;
            letter-spacing: clamp(2px, 0.8vw, 10px);
            text-align: center;
        }

        /*
         * ทำให้พื้นที่นับถอยหลังอยู่กึ่งกลาง
         */
        .app:fullscreen .countdown-area,
        .app:-webkit-full-screen .countdown-area {
            width: 100%;
            height: 100%;
            min-height: 0;
            margin: 0;
            padding: clamp(65px, 10vh, 110px) 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /*
         * ขยายวงแหวนให้เหมาะกับหน้าจอ
         */
        .app:fullscreen .countdown-ring,
        .app:-webkit-full-screen .countdown-ring {
            width: min(68vh, 82vw, 620px);
            max-width: 620px;
            flex: 0 0 auto;
        }

        .app:fullscreen #countdown,
        .app:-webkit-full-screen #countdown {
            font-size: clamp(130px, 24vh, 280px);
        }

        .app:fullscreen .count-label,
        .app:-webkit-full-screen .count-label {
            font-size: clamp(12px, 2vh, 22px);
        }

        .app:fullscreen #milliseconds,
        .app:-webkit-full-screen #milliseconds {
            font-size: clamp(17px, 2.5vh, 28px);
        }

        /*
         * แสดงปุ่ม EXIT เฉพาะ Full Screen
         */
        .app:fullscreen #exitFullScreenButton,
        .app:-webkit-full-screen #exitFullScreenButton {
            position: fixed;
            z-index: 9999;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            min-width: 90px;
            min-height: 44px;
            padding: 9px 15px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--danger);
            border-radius: 7px;
            color: white;
            background: rgba(255, 49, 88, 0.18);
            box-shadow:
                0 0 16px rgba(255, 49, 88, 0.32);
        }

        .app:fullscreen #exitFullScreenButton:hover,
        .app:-webkit-full-screen #exitFullScreenButton:hover {
            color: white;
            background: var(--danger);
            transform: none;
        }

        /*
         * ปรับสำหรับมือถือแนวตั้ง
         */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .app {
                padding: 17px 12px;
            }

            .header {
                flex-direction: column;
            }

            .current-time-box {
                width: 100%;
                text-align: left;
            }

            .countdown-area {
                min-height: 330px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .app:fullscreen .header,
            .app:-webkit-full-screen .header {
                flex-direction: row;
            }

            .app:fullscreen .countdown-ring,
            .app:-webkit-full-screen .countdown-ring {
                width: min(66vh, 82vw);
            }

            .app:fullscreen #countdown,
            .app:-webkit-full-screen #countdown {
                font-size: clamp(105px, 22vh, 210px);
            }
        }

        /*
         * ปรับสำหรับมือถือแนวนอนหรือหน้าจอเตี้ย
         */
        @media (max-height: 550px) {
            .app:fullscreen .header,
            .app:-webkit-full-screen .header {
                top: 10px;
            }

            .app:fullscreen #currentTime,
            .app:-webkit-full-screen #currentTime {
                font-size: clamp(26px, 8vh, 45px);
            }

            .app:fullscreen .countdown-area,
            .app:-webkit-full-screen .countdown-area {
                padding-top: 55px;
                padding-bottom: 8px;
            }

            .app:fullscreen .countdown-ring,
            .app:-webkit-full-screen .countdown-ring {
                width: min(72vh, 58vw);
            }

            .app:fullscreen #countdown,
            .app:-webkit-full-screen #countdown {
                font-size: clamp(90px, 25vh, 170px);
            }

            .app:fullscreen #exitFullScreenButton,
            .app:-webkit-full-screen #exitFullScreenButton {
                top: 10px;
                right: 10px;
                min-width: 75px;
                min-height: 38px;
                padding: 7px 11px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <main id="app" class="app">
        <header class="header">
            <div>
                <div class="system-name">
                    GOLD NEWS // COUNTDOWN
                </div>

                <div class="subtitle">
                    JARVIS EVENT SYNCHRONIZATION SYSTEM
                </div>
            </div>

            <div class="current-time-box">
                <div id="currentTime">00:00:00</div>
                <div id="currentDate">
                    SAT 19 SEP 2026
                </div>
            </div>
        </header>

        <div id="status" class="status-bar">
            SYSTEM READY // SELECT OPERATING MODE
        </div>

        <section class="countdown-area">
            <div id="countdownRing" class="countdown-ring">
                <div class="countdown-inner">
                    <div class="count-label">T-MINUS</div>
                    <div id="countdown">10</div>
                    <div id="milliseconds">.000</div>
                </div>
            </div>
        </section>

        <section class="controls">
            <div class="control-group">
                <label for="targetTime">
                    กำหนดวันและเวลาที่ข่าวจะออก
                </label>

                <input
                    id="targetTime"
                    type="datetime-local"
                    step="1"
                >
            </div>

            <div class="control-group">
                <label for="countdownSeconds">
                    จำนวนวินาทีที่ต้องการนับถอยหลัง
                </label>

                <input
                    id="countdownSeconds"
                    type="number"
                    value="10"
                    min="1"
                    max="60"
                >
            </div>
        </section>

        <div class="buttons">
            <button id="simulateButton" type="button">
                ▶ SIMULATE NOW
            </button>

            <button id="armButton" type="button">
                ◉ ARM TARGET TIME
            </button>

            <button
                id="cancelButton"
                class="cancel"
                type="button"
            >
                ■ CANCEL / RESET
            </button>

            <button id="fullScreenButton" type="button">
                ⛶ FULL SCREEN
            </button>
        </div>

        <div class="info">
            SIMULATE NOW = เริ่มทดลองนับถอยหลังทันที |
            ARM TARGET TIME =
            รอจนถึงช่วงนับถอยหลังก่อนเวลาข่าว
        </div>

        <!-- ปุ่มนี้จะแสดงเฉพาะตอน Full Screen -->
        <button id="exitFullScreenButton" type="button">
            ✕ EXIT
        </button>
    </main>

    <script>
        const appElement =
            document.getElementById("app");

        const currentTimeElement =
            document.getElementById("currentTime");

        const currentDateElement =
            document.getElementById("currentDate");

        const countdownElement =
            document.getElementById("countdown");

        const millisecondsElement =
            document.getElementById("milliseconds");

        const countdownRing =
            document.getElementById("countdownRing");

        const statusElement =
            document.getElementById("status");

        const targetTimeInput =
            document.getElementById("targetTime");

        const countdownSecondsInput =
            document.getElementById("countdownSeconds");

        const simulateButton =
            document.getElementById("simulateButton");

        const armButton =
            document.getElementById("armButton");

        const cancelButton =
            document.getElementById("cancelButton");

        const fullScreenButton =
            document.getElementById("fullScreenButton");

        const exitFullScreenButton =
            document.getElementById(
                "exitFullScreenButton"
            );

        const dayNames = [
            "SUN",
            "MON",
            "TUE",
            "WED",
            "THU",
            "FRI",
            "SAT"
        ];

        const monthNames = [
            "JAN",
            "FEB",
            "MAR",
            "APR",
            "MAY",
            "JUN",
            "JUL",
            "AUG",
            "SEP",
            "OCT",
            "NOV",
            "DEC"
        ];

        let mode = "IDLE";
        let targetTimestamp = null;
        let countdownDuration = 10;
        let lastDisplayedSecond = null;
        let releaseSoundPlayed = false;
        let audioContext = null;

        /*
         * อัปเดตนาฬิกาและวันที่ปัจจุบัน
         */
        function updateCurrentClock() {
            const now = new Date();

            currentTimeElement.textContent =
                now.toLocaleTimeString(
                    "en-GB",
                    {
                        hour12: false,
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );

            const dayName =
                dayNames[now.getDay()];

            const date =
                String(now.getDate()).padStart(2, "0");

            const monthName =
                monthNames[now.getMonth()];

            const year =
                now.getFullYear();

            currentDateElement.textContent =
                `${dayName} ${date} ${monthName} ${year}`;
        }

        /*
         * ตั้งเวลาเริ่มต้นล่วงหน้า 1 นาที
         */
        function setDefaultTargetTime() {
            const defaultTime =
                new Date(Date.now() + 60 * 1000);

            const year =
                defaultTime.getFullYear();

            const month =
                String(
                    defaultTime.getMonth() + 1
                ).padStart(2, "0");

            const date =
                String(
                    defaultTime.getDate()
                ).padStart(2, "0");

            const hour =
                String(
                    defaultTime.getHours()
                ).padStart(2, "0");

            const minute =
                String(
                    defaultTime.getMinutes()
                ).padStart(2, "0");

            const second =
                String(
                    defaultTime.getSeconds()
                ).padStart(2, "0");

            targetTimeInput.value =
                `${year}-${month}-${date}` +
                `T${hour}:${minute}:${second}`;
        }

        /*
         * อ่านค่า datetime-local
         */
        function parseLocalDateTime(value) {
            if (!value) {
                return null;
            }

            const parts = value.split("T");

            if (parts.length !== 2) {
                return null;
            }

            const dateParts =
                parts[0].split("-").map(Number);

            const timeParts =
                parts[1].split(":").map(Number);

            const year = dateParts[0];
            const month = dateParts[1] - 1;
            const date = dateParts[2];

            const hour = timeParts[0] || 0;
            const minute = timeParts[1] || 0;
            const second = timeParts[2] || 0;

            return new Date(
                year,
                month,
                date,
                hour,
                minute,
                second,
                0
            ).getTime();
        }

        /*
         * เปิดระบบเสียง
         */
        function enableAudio() {
            if (!audioContext) {
                const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (AudioContextClass) {
                    audioContext =
                        new AudioContextClass();
                }
            }

            if (
                audioContext &&
                audioContext.state === "suspended"
            ) {
                audioContext.resume();
            }
        }

        /*
         * สร้างเสียงเตือน
         */
        function playTone(
            frequency,
            duration,
            volume = 0.12
        ) {
            if (!audioContext) {
                return;
            }

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                frequency,
                audioContext.currentTime
            );

            gain.gain.setValueAtTime(
                volume,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + duration
            );
        }

        function playCountdownSound(second) {
            if (second <= 3) {
                playTone(950, 0.18, 0.18);
            } else {
                playTone(520, 0.1, 0.1);
            }
        }

        function playReleaseSound() {
            playTone(700, 0.2, 0.2);

            setTimeout(() => {
                playTone(1000, 0.25, 0.2);
            }, 170);

            setTimeout(() => {
                playTone(1400, 0.5, 0.2);
            }, 350);
        }

        /*
         * ตรวจสอบจำนวนวินาที
         */
        function getDuration() {
            let duration =
                Number(countdownSecondsInput.value);

            if (!Number.isFinite(duration)) {
                duration = 10;
            }

            duration = Math.round(duration);

            duration = Math.max(
                1,
                Math.min(duration, 60)
            );

            countdownSecondsInput.value =
                duration;

            return duration;
        }

        /*
         * แปลงเวลารอเป็น HH:MM:SS
         */
        function formatWaitingTime(milliseconds) {
            const totalSeconds = Math.max(
                0,
                Math.ceil(milliseconds / 1000)
            );

            const hours =
                Math.floor(totalSeconds / 3600);

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const seconds =
                totalSeconds % 60;

            return [
                String(hours).padStart(2, "0"),
                String(minutes).padStart(2, "0"),
                String(seconds).padStart(2, "0")
            ].join(":");
        }

        /*
         * เริ่มระบบนับถอยหลัง
         */
        function startCountdown(
            target,
            duration,
            selectedMode
        ) {
            targetTimestamp = target;
            countdownDuration = duration;
            mode = selectedMode;
            lastDisplayedSecond = null;
            releaseSoundPlayed = false;

            countdownRing.classList.remove(
                "warning",
                "released"
            );

            countdownElement.textContent =
                duration;

            millisecondsElement.textContent =
                ".000";

            document.documentElement.style.setProperty(
                "--progress",
                "360deg"
            );
        }

        /*
         * โหมดทดลอง
         */
        simulateButton.addEventListener(
            "click",
            () => {
                enableAudio();

                const duration = getDuration();

                startCountdown(
                    Date.now() + duration * 1000,
                    duration,
                    "SIMULATION"
                );

                statusElement.textContent =
                    "SIMULATION ACTIVE // " +
                    "COUNTDOWN ENGAGED";
            }
        );

        /*
         * โหมดกำหนดเวลาข่าว
         */
        armButton.addEventListener(
            "click",
            () => {
                enableAudio();

                const duration = getDuration();

                const target =
                    parseLocalDateTime(
                        targetTimeInput.value
                    );

                if (!target) {
                    alert(
                        "กรุณากำหนดวันและเวลา" +
                        "ข่าวให้ถูกต้อง"
                    );
                    return;
                }

                if (target <= Date.now()) {
                    alert(
                        "เวลาข่าวต้องเป็นเวลาในอนาคต"
                    );
                    return;
                }

                startCountdown(
                    target,
                    duration,
                    "TARGET"
                );

                statusElement.textContent =
                    "TARGET ARMED // " +
                    "WAITING FOR COUNTDOWN WINDOW";
            }
        );

        /*
         * ยกเลิกและรีเซ็ต
         */
        cancelButton.addEventListener(
            "click",
            resetSystem
        );

        function resetSystem() {
            mode = "IDLE";
            targetTimestamp = null;
            lastDisplayedSecond = null;
            releaseSoundPlayed = false;

            countdownDuration = getDuration();

            countdownElement.textContent =
                countdownDuration;

            millisecondsElement.textContent =
                ".000";

            countdownRing.classList.remove(
                "warning",
                "released"
            );

            document.documentElement.style.setProperty(
                "--progress",
                "360deg"
            );

            statusElement.textContent =
                "SYSTEM READY // " +
                "SELECT OPERATING MODE";
        }

        /*
         * ประมวลผลตัวนับถอยหลัง
         */
        function updateCountdown() {
            if (
                mode === "IDLE" ||
                targetTimestamp === null
            ) {
                return;
            }

            const now = Date.now();

            const remainingMilliseconds =
                targetTimestamp - now;

            const countdownWindow =
                countdownDuration * 1000;

            /*
             * ยังไม่เข้าสู่ช่วงนับถอยหลัง
             */
            if (
                remainingMilliseconds >
                countdownWindow
            ) {
                const untilCountdown =
                    remainingMilliseconds -
                    countdownWindow;

                countdownElement.textContent =
                    countdownDuration;

                millisecondsElement.textContent =
                    ".000";

                statusElement.textContent =
                    "TARGET ARMED // " +
                    "COUNTDOWN STARTS IN " +
                    formatWaitingTime(
                        untilCountdown
                    );

                countdownRing.classList.remove(
                    "warning",
                    "released"
                );

                document.documentElement
                    .style
                    .setProperty(
                        "--progress",
                        "360deg"
                    );

                return;
            }

            /*
             * กำลังนับถอยหลัง
             */
            if (remainingMilliseconds > 0) {
                const displayedSecond =
                    Math.ceil(
                        remainingMilliseconds / 1000
                    );

                const milliseconds =
                    Math.max(
                        0,
                        remainingMilliseconds
                    ) % 1000;

                countdownElement.textContent =
                    displayedSecond;

                millisecondsElement.textContent =
                    "." +
                    String(milliseconds)
                        .padStart(3, "0");

                statusElement.textContent =
                    mode === "SIMULATION"
                        ? "SIMULATION ACTIVE // " +
                          "EVENT APPROACHING"
                        : "NEWS EVENT APPROACHING // " +
                          "STANDBY";

                const progressRatio = Math.max(
                    0,
                    Math.min(
                        remainingMilliseconds /
                        countdownWindow,
                        1
                    )
                );

                document.documentElement
                    .style
                    .setProperty(
                        "--progress",
                        `${progressRatio * 360}deg`
                    );

                if (displayedSecond <= 3) {
                    countdownRing.classList.add(
                        "warning"
                    );
                } else {
                    countdownRing.classList.remove(
                        "warning"
                    );
                }

                countdownRing.classList.remove(
                    "released"
                );

                if (
                    displayedSecond !==
                    lastDisplayedSecond
                ) {
                    playCountdownSound(
                        displayedSecond
                    );

                    lastDisplayedSecond =
                        displayedSecond;
                }

                return;
            }

            /*
             * ถึงเวลาข่าว
             */
            countdownElement.textContent =
                "00";

            millisecondsElement.textContent =
                "NEWS LIVE";

            statusElement.textContent =
                mode === "SIMULATION"
                    ? "SIMULATION COMPLETE // " +
                      "EVENT RELEASED"
                    : "NEWS RELEASED // " +
                      "EVENT IS LIVE";

            document.documentElement
                .style
                .setProperty(
                    "--progress",
                    "360deg"
                );

            countdownRing.classList.remove(
                "warning"
            );

            countdownRing.classList.add(
                "released"
            );

            if (!releaseSoundPlayed) {
                playReleaseSound();
                releaseSoundPlayed = true;
            }
        }

        /*
         * =========================================================
         * ระบบ Full Screen
         * =========================================================
         */

        function getFullScreenElement() {
            return (
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement ||
                null
            );
        }

        /*
         * เข้า Full Screen เฉพาะกล่อง .app
         */
        function enterFullScreen() {
            const requestFullScreen =
                appElement.requestFullscreen ||
                appElement.webkitRequestFullscreen ||
                appElement.msRequestFullscreen;

            if (!requestFullScreen) {
                alert(
                    "เบราว์เซอร์นี้ไม่รองรับ" +
                    "โหมดเต็มหน้าจอ"
                );
                return;
            }

            try {
                const result =
                    requestFullScreen.call(
                        appElement
                    );

                if (
                    result &&
                    typeof result.catch === "function"
                ) {
                    result.catch(() => {
                        alert(
                            "ไม่สามารถเปิด" +
                            "โหมดเต็มหน้าจอได้"
                        );
                    });
                }
            } catch (error) {
                alert(
                    "ไม่สามารถเปิด" +
                    "โหมดเต็มหน้าจอได้"
                );
            }
        }

        /*
         * ออกจาก Full Screen
         */
        function exitFullScreen() {
            const exitMethod =
                document.exitFullscreen ||
                document.webkitExitFullscreen ||
                document.msExitFullscreen;

            if (!exitMethod) {
                return;
            }

            try {
                const result =
                    exitMethod.call(document);

                if (
                    result &&
                    typeof result.catch === "function"
                ) {
                    result.catch(() => {
                        alert(
                            "ไม่สามารถออกจาก" +
                            "โหมดเต็มหน้าจอได้"
                        );
                    });
                }
            } catch (error) {
                alert(
                    "ไม่สามารถออกจาก" +
                    "โหมดเต็มหน้าจอได้"
                );
            }
        }

        /*
         * กด FULL SCREEN จากหน้าปกติ
         */
        fullScreenButton.addEventListener(
            "click",
            enterFullScreen
        );

        /*
         * กด EXIT จากหน้า Full Screen
         */
        exitFullScreenButton.addEventListener(
            "click",
            exitFullScreen
        );

        /*
         * อัปเดตสถานะหลังเข้า/ออก Full Screen
         */
        function handleFullScreenChange() {
            const isFullScreen =
                Boolean(getFullScreenElement());

            document.documentElement.classList.toggle(
                "fullscreen-active",
                isFullScreen
            );

            document.body.classList.toggle(
                "fullscreen-active",
                isFullScreen
            );

            if (isFullScreen) {
                fullScreenButton.textContent =
                    "⛶ FULL SCREEN ACTIVE";
            } else {
                fullScreenButton.textContent =
                    "⛶ FULL SCREEN";
            }
        }

        document.addEventListener(
            "fullscreenchange",
            handleFullScreenChange
        );

        document.addEventListener(
            "webkitfullscreenchange",
            handleFullScreenChange
        );

        document.addEventListener(
            "MSFullscreenChange",
            handleFullScreenChange
        );

        /*
         * วงจรหลักของหน้าจอ
         */
        function animationLoop() {
            updateCurrentClock();
            updateCountdown();

            requestAnimationFrame(
                animationLoop
            );
        }

        setDefaultTargetTime();
        resetSystem();
        updateCurrentClock();
        handleFullScreenChange();
        animationLoop();
    </script>
</body>
  </html>
